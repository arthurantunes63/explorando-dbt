db_profile:
  target: dev
  outputs:

    dev:
      type: databricks
      database: dev_analytics
      # Recomendação da documentação - segmentação por desenvolvedor
      schema: dbt_arthur
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_ACCESS_TOKEN') }}"
      
