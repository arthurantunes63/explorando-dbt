name: Databricks - CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  validate-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalando Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validando bundles
        run: databricks bundle validate