resources:
  jobs:
    dbt_job:
      name: dbt_job
      timeout_seconds: 3600
      max_concurrent_runs: 1
      tasks:
        - task_key: dbt_cli
          dbt_task:
            project_directory: .
            commands:
              - dbt deps
              - dbt seed
              - dbt test
              - dbt run
            warehouse_id: 3a4b2f7c4c435099
            source: GIT
          environment_key: dbt-default
      git_source:
        git_url: https://github.com/arthurantunes63/explorando-dbt
        git_provider: gitHub
        git_branch: trunk
      queue:
        enabled: true
      environments:
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
